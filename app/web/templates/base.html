<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RSS Digest{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>" type="image/svg+xml">

    {# ── Blocking theme script — sets data-theme before CSS loads to prevent flash ── #}
    <script>
    (function() {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        document.documentElement.classList.add('theme-ready');
    })();
    </script>

    <link rel="stylesheet" href="/static/style.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav class="app-nav">
        <a href="/" class="nav-brand">📰 RSS Digest</a>

        <div style="display:flex;align-items:center;gap:0.25rem;">
            <ul class="nav-links">
                <li><a href="/" class="nav-icon {% if request.url.path == '/' %}active{% endif %}">📅 <span class="nav-label">Today</span></a></li>
                <li><a href="/history" class="nav-icon {% if request.url.path.startswith('/history') %}active{% endif %}">📚 <span class="nav-label">History</span></a></li>
                <li><a href="/sources" class="nav-icon {% if request.url.path.startswith('/sources') %}active{% endif %}">📡 <span class="nav-label">Sources</span></a></li>
                <li><a href="/admin" class="nav-icon" title="Admin Panel">⚙️</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">☀️</button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        Personal Media Intelligence Hub
    </footer>

    <script>
    // Dark mode toggle — initial theme already applied by head script
    (function() {
        const toggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        const isDark = html.getAttribute('data-theme') === 'dark';
        toggle.textContent = isDark ? '🌙' : '☀️';

        toggle.addEventListener('click', () => {
            const isDark = html.getAttribute('data-theme') === 'dark';
            if (isDark) {
                html.removeAttribute('data-theme');
                toggle.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                toggle.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        });
    })();
    </script>
</body>
</html>
